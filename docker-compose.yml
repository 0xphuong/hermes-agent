# Pinned instead of inherited from the directory name. setup.sh runs from a
# temporary clone that is deleted afterwards, so without this the project — and
# with it the network name and every `docker compose` lookup — would be named
# after a random tmp directory and change on every install.
name: hermes-agent

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-latest}
    container_name: hermes
    restart: unless-stopped
    command: gateway run

    # All state (config, .env, sessions, memories, skills, logs) lives under
    # /opt/data. The image is stateless — upgrading loses nothing.
    volumes:
      - ${HERMES_DATA_DIR:-~/.hermes}:/opt/data
      # Host timezone. Without this the container runs UTC and every log line,
      # session timestamp and cron entry disagrees with the host clock.
      #
      # The mount alone is enough — deliberately no TZ variable. A zone name in
      # TZ overrides the mount, so setting one would be a second source of
      # truth free to drift from the first.
      #
      # /etc/localtime only, NOT /etc/timezone: that file is absent on Kali and
      # the RHEL family, and a bind mount whose source is missing makes Docker
      # create an empty DIRECTORY at that path on the host.
      - /etc/localtime:/etc/localtime:ro

    networks:
      - hermes-net

    ports:
      # Bound to host loopback by default. Reach the dashboard over an SSH tunnel:
      #   ssh -L 9119:127.0.0.1:9119 user@host
      # To expose it to the LAN/internet, set HERMES_BIND_ADDR=0.0.0.0 in .env
      # AND read the auth section of the README first.
      - "${HERMES_BIND_ADDR:-127.0.0.1}:${HERMES_API_PORT:-8642}:8642"    # OpenAI-compatible API + health
      - "${HERMES_BIND_ADDR:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"  # web dashboard

    environment:
      # --- Dashboard ---------------------------------------------------------
      - HERMES_DASHBOARD=1
      # Inside the container the dashboard binds 0.0.0.0 (the default) so the
      # published port can reach it. A non-loopback bind makes the auth gate
      # MANDATORY — without a provider the container fails closed at startup.
      # The simplest provider is username/password:
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:?set HERMES_DASHBOARD_USER in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD in .env}
      # Keeps login sessions valid across container restarts:
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:?set HERMES_DASHBOARD_SECRET in .env}

      # --- Claude Code -------------------------------------------------------
      # OAuth token for the `claude` CLI (generated with `claude setup-token`).
      # Leave empty to log in manually inside the container instead.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

      # --- claude-proxy (only in the image built from ./Dockerfile) ----------
      # An s6 service running claude_proxy/server.py inside THIS container, so
      # hermes reaches it at http://127.0.0.1:8082 with no second container.
      # It is absent from the published nousresearch image; these variables are
      # simply ignored there. Build with: ./setup.sh --with-claude-code
      - CLAUDE_PROXY_ENABLED=${CLAUDE_PROXY_ENABLED:-1}
      - CLAUDE_PROXY_PORT=${CLAUDE_PROXY_PORT:-8082}
      # LEAVE BOTH EMPTY. Empty means the `claude` CLI talks to
      # api.anthropic.com with the subscription login stored in
      # /opt/data/.claude — which is the entire reason this proxy exists.
      #
      # Setting them routes the CLI through a gateway instead, and that breaks
      # Claude models on any router that namespaces them: the CLI resolves
      # `--model sonnet` to `claude-sonnet-5`, a name a router serving
      # `cc/claude-sonnet-5` does not have, so every call 404s. Only set these
      # for a gateway that accepts plain Anthropic model names.
      #
      # Never point them at the proxy's own port — the run script clears
      # ANTHROPIC_BASE_URL precisely to stop that loop.
      - CLAUDE_PROXY_UPSTREAM_URL=${CLAUDE_PROXY_UPSTREAM_URL:-}
      - CLAUDE_PROXY_UPSTREAM_TOKEN=${CLAUDE_PROXY_UPSTREAM_TOKEN:-}

      # --- Volume file ownership ---------------------------------------------
      # The runtime runs as UID 10000. If the host data directory belongs to a
      # different user (common on NAS boxes and bind mounts), set these to that
      # directory's UID/GID.
      - PUID=${HERMES_PUID:-10000}
      - PGID=${HERMES_PGID:-10000}

      # --- API server (optional) ---------------------------------------------
      # Only needed for OpenAI-compatible clients (Open WebUI, LobeChat, ...) or
      # external tools calling in. Uncomment all three lines together.
      # - API_SERVER_ENABLED=true
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${HERMES_API_KEY:?openssl rand -hex 32}

      # --- Model / platform keys ---------------------------------------------
      # Do NOT declare them here. They belong to ~/.hermes/.env (written by
      # `hermes setup`), which lives on the volume and survives every container
      # recreate. Only forward them here when they come from a secrets manager
      # and must not be written to disk:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

    # Playwright/Chromium needs shared memory; without it browser tools die silently.
    shm_size: "1gb"

    # s6 needs time to shut the per-profile gateways down cleanly.
    stop_grace_period: 30s

    # docker logs does not rotate on its own, and the gateway tees stdout into it,
    # so it grows without bound.
    # (The durable rotated copy still lives at ~/.hermes/logs/gateways/<profile>/current)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"

    # Healthcheck: enable exactly ONE of these, depending on your config.
    #
    # (a) Ask the s6 supervisor directly — works even with the API server off:
    # healthcheck:
    #   test: ["CMD", "/command/s6-svstat", "-u", "/run/service/gateway-default"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 60s
    #
    # (b) Hit the health endpoint — ONLY with API_SERVER_ENABLED=true, otherwise
    #     the container is marked unhealthy forever:
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 60s

  # ---------------------------------------------------------------------------
  # 9router — LLM router. Optional: hermes runs perfectly well without it, so it
  # sits behind the `router` compose profile and stays down unless asked for.
  #
  #   docker compose --profile router up -d      # one-off
  #   COMPOSE_PROFILES=router in .env            # every command, what setup.sh writes
  #
  # When it is running, hermes reaches it by container name at
  # http://9router:20128 — no published port needed for that path.
  # ---------------------------------------------------------------------------
  9router:
    profiles: [router]
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    ports:
      - "${HERMES_BIND_ADDR:-127.0.0.1}:${ROUTER_PORT:-20128}:20128"

    volumes:
      - ${ROUTER_DATA_DIR:-~/.9router}:/app/data
      - /etc/localtime:/etc/localtime:ro

    # A dedicated file, NOT the shared .env — that one holds hermes credentials
    # (dashboard password, CLAUDE_CODE_OAUTH_TOKEN) and env_file would load every
    # single one of them into this container.
    #
    # required: false because compose validates env_file for EVERY service at
    # config time, profile or not. A hermes-only install never creates
    # 9router.env, and without this flag even `docker compose ps` would fail on
    # a file belonging to a service that is deliberately not running.
    env_file:
      - path: 9router.env
        required: false

    # Overrides the values in 9router.env (compose prefers environment over env_file)
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787

    depends_on:
      - headroom

    networks:
      - hermes-net

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Only 9router talks to headroom, so it shares the same profile — pulling in
  # one without the other would leave 9router pointing at nothing.
  headroom:
    profiles: [router]
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped

    # 9router reaches headroom over the internal network; no need to publish it.
    # Uncomment to reach it directly from the host for debugging.
    # ports:
    #   - "${HERMES_BIND_ADDR:-127.0.0.1}:8787:8787"

    volumes:
      - /etc/localtime:/etc/localtime:ro

    networks:
      - hermes-net

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  hermes-net:
    driver: bridge
